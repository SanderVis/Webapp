
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookmark Webapp</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
    <span>Welkom, {{ username }}</span>
    <a href="/logout">Uitloggen</a>
</div>
<div class="container">
    <div class="sidebar" ondragover="allowDrop(event)" ondrop="drop(event)">
        <h2>Mappen</h2>
        <ul id="folderList">
            <li draggable="true" ondragstart="drag(event)">📁 Werk</li>
            <li draggable="true" ondragstart="drag(event)">📁 Persoonlijk</li>
        </ul>
        <input id="searchBox" placeholder="🔍 Zoeken...">
        <div id="results"></div>
    </div>
    <div class="main">
        <div id="bookmarkDetails">
            <h3 id="bookmarkTitle"></h3>
            <p id="bookmarkDesc"></p>
            <iframe id="previewFrame" width="100%" height="600px"></iframe>
        </div>
    </div>
</div>
<script src="/static/script.js"></script>
</body>
</html>
